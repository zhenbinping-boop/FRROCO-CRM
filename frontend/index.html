<!DOCTYPE html>

<html class="h-full" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Faloco CRM - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#747878",
                        "tertiary-fixed-dim": "#c8c8af",
                        "tertiary": "#000000",
                        "on-primary": "#ffffff",
                        "status-earth": "#B7B7A4",
                        "primary-fixed": "#e5e2e1",
                        "surface-white": "#FFFFFF",
                        "on-secondary-fixed-variant": "#444937",
                        "surface-bright": "#faf9f4",
                        "surface-variant": "#e3e3de",
                        "secondary-container": "#e0e5cc",
                        "on-tertiary-container": "#85856f",
                        "tertiary-container": "#1c1d0c",
                        "surface": "#faf9f4",
                        "background": "#faf9f4",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f2f1ec",
                        "warning-amber": "#F2CC8F",
                        "primary": "#000000",
                        "secondary-fixed-dim": "#c4c9b1",
                        "secondary-fixed": "#e0e5cc",
                        "tertiary-fixed": "#e5e4ca",
                        "on-surface": "#1b1c19",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#30312e",
                        "secondary": "#5c614d",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#191d0e",
                        "surface-tint": "#5f5e5e",
                        "outline-variant": "#c4c7c7",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e9e8e3",
                        "on-secondary-container": "#626753",
                        "primary-container": "#1c1b1b",
                        "on-primary-container": "#858383",
                        "on-primary-fixed": "#1c1b1b",
                        "on-primary-fixed-variant": "#474746",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "surface-dim": "#dbdad5",
                        "primary-fixed-dim": "#c8c6c5",
                        "inverse-primary": "#c8c6c5",
                        "error-red": "#E07A5F",
                        "on-tertiary-fixed": "#1c1d0c",
                        "masked-gray": "#E5E5E5",
                        "surface-container-low": "#f5f4ef",
                        "on-surface-variant": "#444748",
                        "surface-container-highest": "#e3e3de",
                        "status-sage": "#84A59D",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#efeee9",
                        "on-background": "#1b1c19",
                        "on-tertiary-fixed-variant": "#474835"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "margin-mobile": "16px",
                        "gutter-desktop": "24px",
                        "margin-desktop": "40px",
                        "card-padding": "24px",
                        "section-gap": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "data-mono": ["jetbrainsMono"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-mono": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-soft-gradient {
            background: linear-gradient(135deg, #faf9f4 0%, #efeee9 100%);
        }
    </style>
<link href="assets/app.css" rel="stylesheet"/>
<link href="assets/global.css" rel="stylesheet"/>
</head>
<body class="bg-background text-on-background h-full font-body-lg flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased bg-soft-gradient">
<main class="w-full max-w-[440px] mx-auto flex flex-col gap-8">
<!-- Header / Branding -->
<div class="text-center flex flex-col items-center justify-center space-y-2">
<div class="w-16 h-16 bg-primary text-on-primary rounded-xl flex items-center justify-center mb-4 shadow-sm" style="box-shadow: 0px 4px 20px rgba(26, 26, 26, 0.08);">
<span class="material-symbols-outlined text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dashboard</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Faloco</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Premium Management</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-8 md:p-10 border border-surface-variant w-full" style="box-shadow: 0px 4px 20px rgba(26, 26, 26, 0.04);">
<form action="#" class="space-y-6" method="POST">
<div class="space-y-5">
<!-- Username/Phone -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface uppercase block" for="username">Username or Phone</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container hover:bg-surface-white focus:bg-surface-white focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md text-on-surface" id="username" name="username" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-1">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface uppercase block" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-on-surface-variant transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-outline-variant rounded-lg bg-surface-container hover:bg-surface-white focus:bg-surface-white focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Keep me signed in
                    </label>
</div>
<!-- Submit Action -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-4 px-8 border border-transparent rounded-lg text-on-primary bg-primary hover:bg-inverse-surface focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors font-label-md text-label-md uppercase tracking-wider" type="submit">
                        Login
                        <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Links -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need an account? <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Contact Support</a>
</p>
</div>
</main>
<script src="assets/app.js" defer></script>
</body></html>
