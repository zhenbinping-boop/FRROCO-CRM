<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>客户详情 - 法洛可 CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;500;600" rel="stylesheet"/>
  <link href="assets/app.css" rel="stylesheet"/>
  <link href="assets/global.css" rel="stylesheet"/>
  <style>
    .customer-detail-page { padding: 32px; }
    .customer-summary { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .customer-summary__identity { display: flex; min-width: 0; align-items: center; gap: 16px; }
    .customer-summary__avatar { display: grid; width: 56px; height: 56px; flex: 0 0 56px; place-items: center; border-radius: 50%; background: var(--farock-primary); color: #fff; font-size: 22px; font-weight: 700; }
    .customer-summary h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: 0; }
    .customer-summary p { margin: 4px 0 0; color: var(--farock-muted); font-size: 14px; }
    .customer-summary__tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .customer-tag { padding: 6px 10px; border: 1px solid var(--farock-border); border-radius: 999px; background: var(--farock-surface-soft); font-size: 12px; font-weight: 600; }
    .customer-tag--mode { background: var(--farock-primary); color: #fff; }
    .customer-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .customer-detail-card { min-width: 0; padding: 24px; }
    .customer-detail-card--wide { grid-column: 1 / -1; }
    .customer-detail-card__title { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; font-size: 18px; line-height: 26px; font-weight: 700; letter-spacing: 0; }
    .customer-detail-card__title .material-symbols-outlined { font-size: 21px; }
    .customer-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 28px; }
    .customer-field { min-width: 0; margin: 0; }
    .customer-field--wide { grid-column: 1 / -1; }
    .customer-field dt { margin-bottom: 6px; color: var(--farock-muted); font-size: 12px; line-height: 18px; font-weight: 600; }
    .customer-field dd { margin: 0; overflow-wrap: anywhere; color: var(--farock-text); font-size: 14px; line-height: 22px; }
    .customer-ledger { width: 100%; border-collapse: collapse; font-size: 14px; }
    .customer-ledger th { padding: 0 16px 12px 0; border-bottom: 1px solid var(--farock-border); color: var(--farock-muted); font-size: 12px; font-weight: 600; text-align: left; }
    .customer-ledger td { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--farock-border); vertical-align: top; }
    .customer-ledger tr:last-child td { border-bottom: 0; }
    .customer-ledger__amount { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    .customer-ledger__amount--income { color: #217346; }
    .customer-ledger__amount--refund { color: #b3261e; }
    .customer-empty { padding: 30px 16px; color: var(--farock-muted); text-align: center; }
    .customer-load-error { color: #b3261e !important; }
    @media (max-width: 900px) {
      .customer-detail-page { padding: 24px; }
      .customer-detail-grid { grid-template-columns: 1fr; }
      .customer-detail-card--wide { grid-column: auto; }
    }
    @media (max-width: 640px) {
      .customer-detail-page { padding: 16px; }
      .customer-summary { align-items: flex-start; flex-direction: column; }
      .customer-summary__tags { justify-content: flex-start; }
      .customer-fields { grid-template-columns: 1fr; }
      .customer-field--wide { grid-column: auto; }
      .customer-ledger-wrap { overflow-x: auto; }
      .customer-ledger { min-width: 620px; }
    }
  </style>
</head>
<body>
  <main class="customer-detail-page">
    <div class="farock-visually-hidden"><h1>客户详情</h1></div>
    <section class="farock-card customer-summary" aria-label="客户概览">
      <div class="customer-summary__identity">
        <span class="customer-summary__avatar" data-customer-avatar aria-hidden="true">客</span>
        <div>
          <h2 data-customer-name>正在加载...</h2>
          <p data-customer-contact>正在读取客户资料</p>
        </div>
      </div>
      <div class="customer-summary__tags">
        <span class="customer-tag customer-tag--mode" data-customer-mode>-</span>
        <span class="customer-tag" data-customer-tier>-</span>
        <span class="customer-tag" data-customer-stage>-</span>
      </div>
    </section>

    <div class="customer-detail-grid">
      <section class="farock-card customer-detail-card">
        <h3 class="customer-detail-card__title"><span class="material-symbols-outlined">person</span>客户基本身份</h3>
        <dl class="customer-fields">
          <div class="customer-field"><dt>客户姓名</dt><dd data-field="name">-</dd></div>
          <div class="customer-field"><dt>客户联系方式</dt><dd data-field="phone">-</dd></div>
          <div class="customer-field"><dt>生日</dt><dd data-field="birthday">-</dd></div>
          <div class="customer-field"><dt>老客户</dt><dd data-field="isReturningCustomer">-</dd></div>
          <div class="customer-field customer-field--wide"><dt>地址</dt><dd data-field="address">-</dd></div>
        </dl>
      </section>

      <section class="farock-card customer-detail-card">
        <h3 class="customer-detail-card__title"><span class="material-symbols-outlined">storefront</span>来源与归属</h3>
        <dl class="customer-fields">
          <div class="customer-field"><dt>来源工作表 / 门店</dt><dd data-field="sourceStore">-</dd></div>
          <div class="customer-field"><dt>客户来源</dt><dd data-field="customerSource">-</dd></div>
          <div class="customer-field"><dt>导购</dt><dd data-field="salesRep">-</dd></div>
          <div class="customer-field"><dt>设计师</dt><dd data-field="designer">-</dd></div>
          <div class="customer-field customer-field--wide"><dt>带单设计师</dt><dd data-field="referralDesigner">-</dd></div>
        </dl>
      </section>

      <section class="farock-card customer-detail-card customer-detail-card--wide">
        <h3 class="customer-detail-card__title"><span class="material-symbols-outlined">contract</span>订单与合同</h3>
        <dl class="customer-fields">
          <div class="customer-field"><dt>下单日期</dt><dd data-field="dealDate">-</dd></div>
          <div class="customer-field"><dt>下单金额</dt><dd data-field="totalAmount">-</dd></div>
          <div class="customer-field"><dt>设计返点金额</dt><dd data-field="designRebateAmount">-</dd></div>
          <div class="customer-field"><dt>设计返点状态</dt><dd data-field="designRebateStatus">-</dd></div>
          <div class="customer-field"><dt>开发票金额</dt><dd data-field="invoiceAmount">-</dd></div>
          <div class="customer-field customer-field--wide"><dt>备注</dt><dd data-field="notes">-</dd></div>
        </dl>
      </section>

      <section class="farock-card customer-detail-card customer-detail-card--wide">
        <h3 class="customer-detail-card__title"><span class="material-symbols-outlined">receipt_long</span>财务流水</h3>
        <div class="customer-ledger-wrap">
          <table class="customer-ledger">
            <thead><tr><th>日期</th><th>金额</th><th>渠道</th><th>进度</th></tr></thead>
            <tbody data-customer-transactions><tr><td class="customer-empty" colspan="4">正在加载财务流水...</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="assets/layout.js" defer></script>
  <script src="assets/api.js" defer></script>
  <script src="assets/app.js" defer></script>
  <script src="assets/customer-detail.js" defer></script>
</body>
</html>
