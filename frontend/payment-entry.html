<body class="text-on-background font-body-md antialiased min-h-screen flex">
<!-- SideNavBar (from JSON, filtered out for this transactional view as per Shell Visibility & Relevance logic) -->
<!-- SUPPRESSED: "Register Payment" is a task-focused, transactional screen -->
<!-- Main Content Area -->
<main class="w-full min-h-screen flex flex-col bg-background relative">
<!-- Transactional Header -->
<header class="sticky top-0 z-30 w-full bg-surface-bright/90 backdrop-blur-md border-b border-outline-variant/30 px-margin-mobile md:px-margin-desktop h-20 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2 group">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md hidden md:inline">返回订单 ORD-2023-089</span>
</button>
<div class="h-6 w-px bg-outline-variant/50 hidden md:block mx-2"></div>
<h1 class="font-headline-md text-headline-md text-primary">登记收款</h1>
</div>
<div class="flex items-center gap-4">
<span class="px-3 py-1 bg-surface-container-highest text-on-surface rounded-full font-label-md text-label-md hidden sm:inline-block">
                    草稿
                </span>
<button class="bg-transparent border-[1.5px] border-primary text-primary hover:bg-surface-container-low transition-colors px-4 py-2 rounded font-label-md text-label-md">
                    取消
                </button>
</div>
</header>
<!-- Form Content -->
<div class="flex-1 overflow-y-auto px-margin-mobile md:px-margin-desktop py-section-gap">
<div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-gutter-desktop">
<!-- Left Column: Order Summary (Context) -->
<div class="lg:col-span-4 flex flex-col gap-gutter-desktop">
<div class="bg-surface-white border border-surface-variant rounded-xl p-card-padding shadow-[0_4px_20px_rgba(26,26,26,0.04)]">
<div class="flex items-center justify-between mb-6">
<h2 class="font-headline-md text-headline-md text-primary">订单摘要</h2>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="receipt_long">receipt_long</span>
</div>
<div class="space-y-4">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">客户</p>
<p class="font-body-lg text-body-lg text-on-surface" id="payment-order-customer">加载中...</p>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">项目</p>
<p class="font-body-md text-body-md text-on-surface" id="payment-order-project">加载中...</p>
</div>
<hr class="border-surface-variant my-4"/>
<div class="flex justify-between items-center">
<p class="font-body-md text-body-md text-on-surface-variant">订单总额</p>
<p class="font-data-mono text-data-mono text-on-surface" id="payment-order-total">¥0.00</p>
</div>
<div class="flex justify-between items-center text-status-sage">
<p class="font-body-md text-body-md">已付金额</p>
<p class="font-data-mono text-data-mono" id="payment-order-paid">¥0.00</p>
</div>
<div class="flex justify-between items-center pt-2 mt-2 border-t border-surface-variant">
<p class="font-label-md text-label-md text-primary">待付余额</p>
<p class="font-data-mono text-data-mono text-primary font-bold text-lg" id="payment-order-balance">¥0.00</p>
</div>
</div>
</div>
<!-- Ambient illustration/brand moment -->
<div class="hidden lg:block h-48 bg-surface-container rounded-xl overflow-hidden relative">
<div class="bg-cover bg-center w-full h-full opacity-60 mix-blend-multiply" data-alt="Abstract architectural rendering in soft, bright light mode style, featuring clean lines, off-white and pale cream tones with subtle charcoal shadows, embodying minimal premium craftsmanship." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCgRY9Kdk8gDM90pAFHjQlTexgwU52WRbj1W8W0T2EzH5XWd8YjuSJ7t6ej3McGwPQH8i3GMehEsvCILD98pZdMV-kqBxrTAoYeaEyFP7cc5XIqfZj0eFIEnbA4dIh8Esz73i_GitCDzxvu2g61rY314ppgYDBz9aJ44JxfmVVvScaaS1uZXsaFtTRQ8VjMQBFmBKyrGs_iRyNhIe2SbNIhokN1CxVaj_r1fB59z8pvpvg6mXYa5R54')"></div>
</div>

<!-- Right Column: Payment Form -->
<div class="lg:col-span-8">
<form class="bg-surface-white border border-surface-variant rounded-xl p-card-padding shadow-[0_4px_20px_rgba(26,26,26,0.04)] flex flex-col gap-8" id="payment-form">
<!-- Section 1: Payment Details -->
<div>
<h3 class="font-headline-md text-headline-md text-primary border-b border-surface-variant pb-4 mb-6">收款详情</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Payment Type -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">收款类型</label>
<div class="relative">
<select class="w-full bg-[#F1F0EA] focus:bg-surface-white border-none focus:ring-1 focus:ring-primary rounded-lg p-3 appearance-none font-body-md text-on-surface cursor-pointer" name="type" required>
<option disabled="" selected="" value="">请选择类型...</option>
<option value="DEPOSIT">定金</option>
<option value="MILESTONE">阶段款</option>
<option value="BALANCE">尾款</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Amount -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">金额</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 font-data-mono text-on-surface-variant">$</span>
<input class="w-full bg-[#F1F0EA] focus:bg-surface-white border-none focus:ring-1 focus:ring-primary rounded-lg p-3 pl-8 font-data-mono text-on-surface" name="amount" placeholder="0.00" type="number" min="0.01" step="0.01" required/>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">收款日期</label>
<div class="relative">
<input class="w-full bg-[#F1F0EA] focus:bg-surface-white border-none focus:ring-1 focus:ring-primary rounded-lg p-3 font-body-md text-on-surface" name="paidAt" type="date" required/>
</div>
</div>
<!-- Reference Number -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">参考编号（可选）</label>
<input class="w-full bg-[#F1F0EA] focus:bg-surface-white border-none focus:ring-1 focus:ring-primary rounded-lg p-3 font-body-md text-on-surface" name="referenceNumber" placeholder="例如：TRC-99201" type="text"/>
</div>
</div>
</div>
<!-- Section 2: Payment Method -->
<div>
<h3 class="font-headline-md text-headline-md text-primary border-b border-surface-variant pb-4 mb-6">收款方式</h3>
<!-- Bento-style radio selector -->
<div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
<!-- Card -->
<label class="relative flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface-white cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-surface-container-low has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="method" type="radio" value="CARD"/>
<span class="material-symbols-outlined text-[28px] mb-2 text-on-surface" data-icon="credit_card">credit_card</span>
<span class="font-label-md text-label-md text-on-surface">银行卡</span>
</label>
<!-- Wire Transfer -->
<label class="relative flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface-white cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-surface-container-low has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="method" type="radio" value="BANK_TRANSFER"/>
<span class="material-symbols-outlined text-[28px] mb-2 text-on-surface" data-icon="account_balance">account_balance</span>
<span class="font-label-md text-label-md text-on-surface">银行转账</span>
</label>
<!-- WeChat -->
<label class="relative flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface-white cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-surface-container-low has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="method" type="radio" value="WECHAT"/>
<span class="material-symbols-outlined text-[28px] mb-2 text-on-surface" data-icon="chat">chat</span>
<span class="font-label-md text-label-md text-on-surface">微信支付</span>
</label>
<!-- Cash -->
<label class="relative flex flex-col items-center justify-center p-4 rounded-xl border border-surface-variant bg-surface-white cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-surface-container-low has-[:checked]:ring-1 has-[:checked]:ring-primary">
<input class="sr-only" name="method" type="radio" value="CASH"/>
<span class="material-symbols-outlined text-[28px] mb-2 text-on-surface" data-icon="payments">payments</span>
<span class="font-label-md text-label-md text-on-surface">现金</span>
</label>
</div>
</div>
<!-- Section 3: Receipt Upload -->
<div>
<h3 class="font-headline-md text-headline-md text-primary border-b border-surface-variant pb-4 mb-6">收款凭证</h3>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center text-center bg-[#F1F0EA] hover:bg-surface-container-low transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-[40px] text-on-surface-variant mb-4 group-hover:text-primary transition-colors" data-icon="cloud_upload">cloud_upload</span>
<p class="font-body-md text-body-md text-on-surface mb-1">拖放收款凭证图片或文档文件</p>
<p class="font-label-md text-label-md text-on-surface-variant uppercase">或点击选择文件</p>
<input accept="image/*,.pdf" class="hidden" type="file"/>
</div>
</div>
<!-- Form Actions -->
<div class="flex justify-end gap-4 pt-6 border-t border-surface-variant mt-4">
<button class="bg-transparent border-[1.5px] border-primary text-primary hover:bg-surface-container-low transition-colors px-[32px] py-[16px] rounded font-label-md text-label-md uppercase tracking-wider" type="button">
                                保存为草稿
                            </button>
<button class="bg-primary text-on-primary hover:bg-surface-tint transition-colors px-[32px] py-[16px] rounded font-label-md text-label-md uppercase tracking-wider shadow-sm flex items-center gap-2" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="check">check</span>
                                登记收款
                            </button>
</div>
</form>
</div>
</div>
</div>
</main>
<script>
        // Simple drag and drop visual feedback script
        const dropZone = document.querySelector('.border-dashed');
        if(dropZone) {
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-primary', 'bg-surface-container-low');
                dropZone.classList.remove('border-outline-variant', 'bg-[#F1F0EA]');
            });
            dropZone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-primary', 'bg-surface-container-low');
                dropZone.classList.add('border-outline-variant', 'bg-[#F1F0EA]');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-primary', 'bg-surface-container-low');
                dropZone.classList.add('border-outline-variant', 'bg-[#F1F0EA]');
                // Handle file visually here in a real app
                const p = dropZone.querySelector('p.font-body-md');
                if(e.dataTransfer.files.length > 0) {
                    p.textContent = `已选择文件：${e.dataTransfer.files[0].name}`;
                    p.classList.add('text-primary', 'font-medium');
                }
            });
            
            // Click to upload simulation
            dropZone.addEventListener('click', () => {
               const fileInput = dropZone.querySelector('input[type="file"]');
               fileInput.click();
            });
        }
    </script>
